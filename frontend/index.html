<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: экранная клавиатура уменьшает
      видимую область, а не наезжает на неё, и кнопка внизу экрана
      поднимается над клавиатурой
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Не просрочь</title>
    <!--
      SDK Telegram Web Apps подключается скриптом, а не пакетом npm:
      Telegram отдаёт его сам и выставляет CSS-переменные темы ещё
      до отрисовки приложения.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
